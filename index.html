<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cung Chúc Xuân Bính Ngọ 2026</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="tet-container">
        <h1 class="main-title">CUNG CHÚC XUÂN BÍNH NGỌ 2026</h1>
        
        <div class="wheel-wrapper">
            <div class="pointer">▼</div>
            <canvas id="wheel" width="500" height="500"></canvas>
        </div>

        <button id="spin-btn">QUAY NGAY</button>

        <div id="result-popup" class="popup hidden">
            <div class="popup-content">
                <h2>🧧 LỘC XUÂN 🧧</h2>
                <p id="wish-text"></p>
                <button id="close-btn">QUAY TIẾP</button>
            </div>
        </div>
    </div>
    
    <audio id="firework-sound" src="https://assets.mixkit.co/active_storage/sfx/2014/2014-preview.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
